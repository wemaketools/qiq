  #     - uses: actions/setup-node@v4
  #       with: { node-version: '22', cache: npm }
  #     - run: npm ci
  #     - run: npx --prefix e2e_tests playwright install --with-deps chromium
  #     - run: npm run supabase:start
  #     - run: npm run supabase:reset
  #     # Export the local Supabase keys the API runner and the SPA need, then seed + run smoke.
  #     - run: |
  #         eval "$(npx supabase status -o env | sed 's/^/export /')"
  #         {
  #           echo "SUPABASE_URL=$API_URL"
  #           echo "SUPABASE_ANON_KEY=$ANON_KEY"
  #           echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
  #           echo "VITE_SUPABASE_URL=$API_URL"
  #           echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
  #           echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
  #           echo "DIRECT_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
  #           echo "API_KEY_PEPPER=ci-only-pepper"
