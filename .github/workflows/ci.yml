name: CI

# Every gate a task must pass before it can be called done (T-010, M-24, G-7, N-06).
#
# ORDERING: cheap-and-fast first, so a typo fails in ~2 minutes rather than after the Supabase
# stack has booted. Everything runs in ONE job on ONE runner because the backend integration
# suite needs the Supabase stack that an earlier step starts, and because the vitest suites are
# not safe to run concurrently with each other against a single database.
#
# NODE VERSION: pinned to 22 to match `engines` in package.json and `nodejs22.x` in vercel.json.
# Do not float this to `lts/*` — the point is to test the version Vercel actually runs.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # One CI run per ref. A second push cancels the first; the Supabase stack and the destructive
  # migration validation must not have two runs racing on the same runner class.
  #
  # EXCEPT on the two deploying branches. Workflow-level cancellation kills every job in the run,
  # including `migrate` — cancelling that mid-`db push` can leave a hosted database with a
  # partially applied migration set and a history table that disagrees with the schema. On dev and
  # main a second push therefore QUEUES behind the first instead of cancelling it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

env:
  # Best-effort suppression of the Supabase CLI's anonymous telemetry. Runners often cannot reach
  # its analytics endpoint, and the CLI then spends ~10s timing out and exits non-zero even when
  # the command itself succeeded. Belt and braces only: whether this variable is honoured varies
  # by CLI version, so scripts/db/ensure-signing-keys.mjs no longer trusts the exit code either.
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: typecheck, lint, tests, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report toolchain versions
        run: |
          node --version
          npm --version
          npx supabase --version

      # ---------------------------------------------------------------------------------
      # Static gates (no Docker required)
      # ---------------------------------------------------------------------------------

      - name: Typecheck (backend)
        run: npm run typecheck

      - name: Typecheck (SPA)
        run: npm run typecheck:ui

      - name: Lint (backend)
        run: npm run lint

      - name: Lint (SPA)
        run: npm run lint:ui

      # ---------------------------------------------------------------------------------
      # SPA suite and production build (no Docker required, so they run before the slow part)
      # ---------------------------------------------------------------------------------

      - name: SPA tests (fails on any skipped test; enforces a test-count floor)
        run: npm run ci:test:ui

      - name: SPA production build
        run: npm run build:ui

      # Security scans (no Docker). Fail fast on a committed secret or a server secret/module that
      # leaked into the built SPA bundle, before the slow Supabase stage. scan-bundle rebuilds the
      # SPA itself so it is self-contained; ci:test also composes ci:security as the hard guarantee.
      - name: Security scans (repo secrets + built-bundle leak scan)
        run: npm run ci:security

      # ---------------------------------------------------------------------------------
      # Supabase stack + backend suite
      #
      # The CLI comes from the version pinned in devDependencies (node_modules/.bin is on PATH
      # inside npm scripts), NOT from supabase/setup-cli, so CI and laptops run the same CLI.
      # The stack starts from a clean state every run; the Docker volume is deliberately not
      # cached, because migration-from-clean is precisely what is under test.
      # ---------------------------------------------------------------------------------

      - name: Start local Supabase stack
        run: npm run supabase:start

      - name: Reset database (migrations + baseline seed)
        run: npm run supabase:reset

      - name: Backend tests — unit + integration (fails on any skipped test)
        # The integration suites skip themselves when the stack is unreachable and STILL EXIT 0
        # (deliberate, so a laptop without Docker is not blocked). In CI the stack is always
        # provisioned, so ci:test fails the build on a single skipped test. Without this wrapper
        # a stack that failed to boot would report a green build on tests that never ran.
        run: npm run ci:test

      # ---------------------------------------------------------------------------------
      # Migration-from-clean validation (AC-004 / AC-086, V-005 / V-110)
      #
      # Destructive: resets the database from empty TWICE, dumps the schema and diffs it against
      # the committed supabase/schema.expected.sql snapshot. Runs last because it wipes the data
      # the integration suites rely on.
      # ---------------------------------------------------------------------------------

      - name: Validate migrations from a clean database
        run: npm run db:validate

      # Generated-type drift is already asserted by
      # src/server/tests/integration/db-types-drift.test.ts, so there is no separate step here.

      - name: Stop local Supabase stack
        if: always()
        run: npm run supabase:stop

  # -------------------------------------------------------------------------------------
  # END-TO-END SMOKE (T-043) — ready-to-enable, not active by default.
  #
  # DECISION (T-043): the CI e2e gate is a SMOKE SUBSET, not the full Playwright suite. The full
  # suite needs the running app (API runner + SPA), the demo seed, and a real browser driving long
  # journeys; running all ~30 specs on every push is slow and, at cutover, still carries data
  # reconciliation debt (see the T-043 findings). The per-PR gate therefore runs only the auth
  # surface (`--project=smoke`: smoke/login/logout) — enough to catch a broken login, proxy, or
  # boot — while the full suite is run locally / on demand via `npm run test:e2e`.
  #
  # It is kept as a separate job (its own Supabase reset + demo seed + browser) so it never slows or
  # destabilises the `verify` gate. Enable by uncommenting; Playwright's webServer starts the app.
  #
  # e2e_smoke:
  #   name: e2e smoke (auth surface + shell)
  #   needs: verify
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: '22', cache: npm }
  #     - run: npm ci
  #     - run: npx --prefix e2e_tests playwright install --with-deps chromium
  #     - run: npm run supabase:start
  #     - run: npm run supabase:reset
  #     # Export the local Supabase keys the API runner and the SPA need, then seed + run smoke.
  #     - run: |
  #         eval "$(npx supabase status -o env | sed 's/^/export /')"
  #         {
  #           echo "SUPABASE_URL=$API_URL"
  #           echo "SUPABASE_ANON_KEY=$ANON_KEY"
  #           echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
  #           echo "VITE_SUPABASE_URL=$API_URL"
  #           echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
  #           # DB_URL comes from the `supabase status -o env` eval above — no hardcoded password.
  #           echo "SUPABASE_DATABASE_URL=$DB_URL"
  #           echo "SUPABASE_DIRECT_DATABASE_URL=$DB_URL"
  #           echo "API_KEY_PEPPER=ci-only-pepper"
  #         } > .env.local
  #     - run: CI=1 npm run test:e2e:smoke
  #     - run: npm run supabase:stop
  #       if: always()
  # -------------------------------------------------------------------------------------

  # -------------------------------------------------------------------------------------
  # SCHEMA DELIVERY — dev branch -> qiq-dev, main -> qiq-PROD.
  #
  # WHAT THIS SHIPS: schema only. `supabase db push` applies the migration files in
  # supabase/migrations/ that the target's history table has not recorded yet, in filename order.
  # It never copies rows out of any database. The one data-shaped step is the BASELINE seed
  # (permission catalog + global default reference template), which is code-owned, conflict-
  # tolerant and transactional — see supabase/seed.sql. Tenant and demo data are never seeded here.
  #
  # CREDENTIALS: Doppler is the single source of truth and already syncs each config into the
  # matching GitHub Actions ENVIRONMENT, so this job just reads `secrets.*`. No Doppler token, no
  # CLI install, no fetch step — the values are placed by the sync before the run starts.
  #
  #   Doppler config   GitHub Environment   Supabase project   APP_ENV
  #   dev              dev                  qiq-dev            dev
  #   prd              Production           qiq-PROD           production
  #
  # That the sync targets an ENVIRONMENT rather than repository secrets is what makes the whole
  # job work: the same `${{ secrets.X }}` expression resolves to a different project per branch.
  # A repository-level sync would collapse both branches onto one project, and nothing in this
  # file would look wrong.
  #
  # ENVIRONMENT NAMES ARE MATCHED VERBATIM by the `environment:` expression below. If either is
  # renamed in GitHub or re-pointed in Doppler, change it here too — a name that matches nothing
  # yields an environment with no secrets, and the job fails at the first `supabase link`.
  #
  # Put required reviewers on `Production`. GitHub evaluates that gate BEFORE exposing the
  # environment's secrets, so an unapproved run never obtains the production credentials.
  #
  # The Doppler config must carry the full server catalog — SUPABASE_DATABASE_URL,
  # SUPABASE_DIRECT_DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
  # CRON_SECRET, INTERNAL_JOB_SECRET, API_KEY_PEPPER — plus SUPABASE_ACCESS_TOKEN,
  # SUPABASE_PROJECT_REF and SUPABASE_DATABASE_PASSWORD for the CLI. Most are unused by the push
  # itself, but getConfig() validates the WHOLE configuration before seed.ts may open a connection
  # (AC-010), so a partial config fails the seed step rather than half-seeding.
  # -------------------------------------------------------------------------------------

  migrate:
    name: Migrate ${{ github.ref_name == 'main' && 'qiq-PROD' || 'qiq-dev' }}
    needs: verify
    # Pushes only. A PR must never touch a hosted database — it has not passed `verify` on the
    # merged result yet, and its head branch is not a deploying branch.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'Production' || 'dev' }}

    concurrency:
      # Serialise per target. Never cancel: a cancelled `db push` is the one failure mode that
      # leaves a hosted schema in a state no rerun can reason about.
      group: migrate-${{ github.ref }}
      cancel-in-progress: false

    env:
      # Placed by the Doppler sync into this job's environment. SUPABASE_DB_PASSWORD is the name
      # the Supabase CLI itself reads and is fixed by the CLI; Doppler stores the value under
      # SUPABASE_DATABASE_PASSWORD, so the mapping happens here rather than in Doppler. Set as env
      # rather than passed as `--password`, which would expose it in the process list.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}

      # Derived from the BRANCH, not read from the secret store: which tier a push targets is a
      # property of what was merged, and stays visible in this file rather than in a config anyone
      # can edit. seed.ts refuses unless this matches the APP_ENV the loaded configuration
      # resolves to, so once APP_ENV is added to the Doppler configs (it must be — the deployed
      # app needs it, and without it the config module defaults to `local`), a config wired to the
      # wrong tier fails loudly here instead of seeding the wrong database.
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The CLI is the version pinned in devDependencies, identical to the one `verify` just ran
      # the migrations through locally.
      - name: Link to the target Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Printed before anything is applied, so the run log records exactly which migrations this
      # deployment introduced. This is the audit trail for a schema change.
      - name: List pending migrations (applies nothing)
        run: npx supabase db push --dry-run

      - name: Push migrations
        run: npx supabase db push --yes

      # Not --include-seed: that would run the file through the CLI's own path. `npm run db:seed`
      # is the sanctioned deploy-time route (Q-8) — it extracts the same baseline block, runs it in
      # ONE transaction over SUPABASE_DIRECT_DATABASE_URL, and refuses to touch a non-local target
      # unless --env matches the APP_ENV the loaded configuration resolves to.
      - name: Apply baseline seed (permission catalog + default reference template)
        run: npm run db:seed -- --baseline --env="$APP_ENV"
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DIRECT_DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          API_KEY_PEPPER: ${{ secrets.API_KEY_PEPPER }}

  # -------------------------------------------------------------------------------------
  # APPLICATION DEPLOY — deliberately NOT here.
  #
  # Vercel's own Git integration builds and deploys on push, which is the supported path and the
  # one that gives preview URLs per PR. Point its Production branch at `main` and add `dev` as a
  # deploy branch in the Vercel project settings; no workflow step is needed.
  #
  # ORDERING CAVEAT: that integration deploys in parallel with this workflow, so an additive
  # migration may land after the code that reads it. For the usual expand/contract discipline
  # (add nullable column -> ship code -> backfill -> drop old) that is safe. It is NOT safe for a
  # breaking change; those still want a human sequencing the two, or a `vercel deploy` step moved
  # in here behind `needs: migrate` with the Git integration turned off.
  # -------------------------------------------------------------------------------------
